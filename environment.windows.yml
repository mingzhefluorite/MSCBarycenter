# Conda environment for PGW_Metric (Windows-friendly).
# Create: conda env create -f environment.windows.yml
# Update: conda env update -f environment.windows.yml --prune
name: mscbarycenter
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - networkx
  - pot
  - h5py
  - numba
  - pillow
  - imageio
  - joblib
  - plotly
  - tqdm
  - jupyterlab
  - notebook
  - ipykernel
